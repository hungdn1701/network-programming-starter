services:
  server:
    build: ./server
    ports:
      - "${SERVER_PORT:-5000}:5000"
    env_file: .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "echo", "healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  client:
    build: ./client
    env_file: .env
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    # Simulates a network environment for testing
