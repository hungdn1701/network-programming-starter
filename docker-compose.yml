# Start the server:            docker compose up --build -d
# Start an interactive client: docker compose run --rm client   (repeat in other terminals for more clients)

services:
  server:
    build: ./server
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-5000}
    restart: "no"
    networks:
      - app-network
    # Optional: add a healthcheck that suits your image, e.g. for images with bash:
    # healthcheck:
    #   test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/$${SERVER_PORT}' || exit 1"]
    #   interval: 10s
    #   retries: 3

  client:
    build: ./client
    profiles: ["client"]        # not started by `docker compose up`; use `docker compose run --rm client`
    stdin_open: true            # interactive CLI
    tty: true
    env_file:
      - path: .env
        required: false
    environment:
      CLIENT_TARGET_HOST: ${CLIENT_TARGET_HOST:-server}
      CLIENT_TARGET_PORT: ${CLIENT_TARGET_PORT:-5000}
    depends_on:
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
