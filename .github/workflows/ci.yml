name: CI

on:
  push:
  pull_request:

jobs:
  instruction:
    name: INSTRUCTION.md unchanged
    # Skipped in the official starter itself — that copy *is* the official version.
    if: github.repository != 'hungdn1701/network-programming-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-instruction.sh

  build-and-smoke:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect source code
        id: src
        run: |
          if find server/src -type f ! -name .gitkeep | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::server/src is empty — build & smoke test skipped until you add code"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare .env
        if: steps.src.outputs.present == 'true'
        run: cp .env.example .env

      - name: Build images
        if: steps.src.outputs.present == 'true'
        run: docker compose --profile client build

      - name: Start server
        if: steps.src.outputs.present == 'true'
        run: docker compose up -d server

      - name: Smoke test
        if: steps.src.outputs.present == 'true'
        run: bash scripts/smoke-test.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
