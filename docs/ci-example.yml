# CI example — NOT enabled. GitHub only runs workflows placed under .github/workflows/.
# Turn it on once your server has code worth checking:
#   mkdir -p .github/workflows && cp docs/ci-example.yml .github/workflows/ci.yml
# Why it is off by default: an empty template has nothing to test, and every fork running
# CI on each push spends GitHub Actions minutes.
#
# It builds and starts the server, then runs the smoke test (same as `make up && make smoke`).
# Add your own unit or integration tests as extra steps.

name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - run: bash scripts/smoke-test.sh
      # - run: <your test command, e.g. ./mvnw test, go test ./..., pytest>
      - if: always()
        run: docker compose down -v
